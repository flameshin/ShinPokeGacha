<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokémon 5e Gacha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Instrument+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#eef1f7;--ink:#14213d;--mute:#5b6784;--card:#fff;--line:#d3d9e8;--red:#e63946;--yel:#ffcb05;--on-red:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1426;--ink:#eef1f7;--mute:#9aa6c4;--card:#162039;--line:#2a3658}}
:root[data-theme="dark"]{--bg:#0d1426;--ink:#eef1f7;--mute:#9aa6c4;--card:#162039;--line:#2a3658}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Instrument Sans",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font:800 clamp(24px,7vw,34px)/1.1 Unbounded,system-ui,sans-serif;margin:8px 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 20px}
label{display:block;font-weight:600;margin:14px 0 6px}
input,select{width:100%;padding:12px 14px;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
button{font:inherit;cursor:pointer}
.roll{width:100%;margin-top:18px;padding:16px;border:0;border-radius:14px;background:var(--red);color:var(--on-red);font:800 17px Unbounded,system-ui,sans-serif;box-shadow:0 5px 0 rgba(0,0,0,.28)}
.roll:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.roll:disabled{opacity:.6}
.err{color:var(--red);min-height:1.4em;margin:6px 0 0;font-size:14px}
.res{margin-top:18px;border-radius:18px;background:var(--card);border:2px solid var(--line);overflow:hidden}
.res .band{height:12px;background:linear-gradient(90deg,var(--red) 50%,var(--yel) 50%)}
.res .body{padding:18px}
.name{font:800 clamp(26px,8vw,38px)/1.1 Unbounded,system-ui,sans-serif;margin:0 0 12px;word-break:break-word}
.name.spin{color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}
.k{color:var(--mute);min-width:64px}
.badge{padding:3px 12px;border-radius:99px;color:#fff;font-weight:600;font-size:14px}
.sr{display:inline-block;padding:2px 12px;border-radius:8px;background:var(--yel);color:#14213d;font-weight:800}
.who{margin:12px 0 0;color:var(--mute);font-size:14px}
.logs{margin-top:28px}
.lh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.lh h2{font:600 18px Unbounded,system-ui,sans-serif;margin:0}
.ghost{padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:transparent;color:var(--ink)}
.ghost.warn{border-color:var(--red);color:var(--red)}
ul{list-style:none;margin:12px 0 0;padding:0}
li{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:8px;font-size:15px}
li b{font-weight:600}
li small{display:block;color:var(--mute)}
.empty{color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.vl{display:inline-block;margin:0 0 6px;color:var(--ink);font-weight:600}
.lh a{color:var(--ink);font-weight:600}
</style>
</head>

<main id="mm">

<h1>Pokémon 5e Gacha</h1>
<p class="sub">Isi nama karakter, pilih target SR, lalu tekan Roll Encounter.</p>

<select id="rg"></select>

<select id="bi"></select>

<div class="band"></div>
<div class="body">

<div class="row"><span class="k">Shiny</span><span id="psh">???</span></div>
<div class="row"><span class="k">Region</span><span id="prg">???</span></div>
<div class="row"><span class="k">Biome</span><span id="pbi">???</span></div>
<p class="who" id="who"></p>
</div>
</section>
<section class="logs">
<div class="lh"><h2>Recent rolls</h2><a href="#logs">View all logs</a></div>
<ul id="log"></ul>

</section>
</main>

try{localStorage.setItem("p5g-name",c)}catch(e){}
const [lo,hi]=rng[sel.value];
const rs=resolve(lo,hi),pool=rs.pool;
if(!pool.length){$("err").textContent="Tidak ada Pokémon pada SR itu.";return}
const pick=pool[rnd(pool.length)];
const fin=()=>{
const g=gender(pick[3]),nv=NAT[rnd(NAT.length)],nat=nv[1]?nv[0]+" ["+nv[1]+"]":nv[0];
const ha=pick[6]&&rnd(HA_ODDS)===0?pick[6]:"",sh=rnd(SHINY_ODDS)===0;
$("pn").classList.remove("spin");$("pn").textContent=(sh?"✦ ":"")+pick[0];
$("pg").textContent=g;$("pt").textContent=nat;$("pty").innerHTML=badges(pick[1]);$("psr").innerHTML=`<span class="sr">${fs(pick[2])}</span>`;
$("pha").textContent=ha?"Yes: "+ha:pick[6]?"No":"No hidden ability";$("psh").textContent=sh?"Yes ✦":"No";$("prg").textContent=rs.r;$("pbi").textContent=rs.b;$("who").textContent="Encounter untuk "+c+" · tersimpan ke log";
addLog({ha,sh,r:rs.r,b:rs.b,c,n:pick[0],g,nat,t:pick[1],s:pick[2],d:Date.now()}).then(ok=>{if(!ok)$("who").textContent="Encounter untuk "+c+" · tidak tersimpan ke log bersama (gagal menyimpan, cek koneksi)"});
busy=false;$("go").disabled=false};
busy=true;$("go").disabled=true;
["pg","pt","pty","psr","pha","psh","prg","pbi"].forEach(i=>$(i).textContent="???");
if(matchMedia("(prefers-reduced-motion:reduce)").matches){fin();return}
$("pn").classList.add("spin");
let n=0;const iv=setInterval(()=>{$("pn").textContent=pool[rnd(pool.length)][0];if(++n>=18){clearInterval(iv);fin()}},70)};
$("cp").onclick=async()=>{
const t=logs.map(l=>`${l.c} | ${l.n} | SR ${fs(l.s)} | ${l.g} | ${l.nat} | ${l.t}`).join("\n");
try{await navigator.clipboard.writeText(t);$("cp").textContent="Tersalin"}catch(e){$("cp").textContent="Gagal menyalin"}
setTimeout(()=>$("cp").textContent="Copy log",1500)};
</script>
</body>
